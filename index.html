<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monty Hall Animated Simulation</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
    padding: 30px;
  }

  h1 { margin-bottom: 10px; }

  .controls {
    margin-bottom: 20px;
  }

  button, input {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }

  button {
    background: #38bdf8;
    cursor: pointer;
  }

  button:hover {
    background: #0ea5e9;
  }

  .doors {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
  }

  .door {
    width: 100px;
    height: 160px;
    background: #334155;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.3s, background 0.3s;
  }

  .door.open {
    background: #16a34a;
    transform: scale(1.1);
  }

  .door.revealed {
    background: #ef4444;
  }

  .selected {
    outline: 3px solid #facc15;
  }

  .results {
    margin-top: 20px;
    font-size: 18px;
  }
</style>
</head>

<body>

<h1>Monty Hall Live Simulation</h1>

<div class="controls">
  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
  <br>
  Speed:
  <input type="range" id="speed" min="0" max="1000" value="300">
  <span id="speedLabel">300 ms</span>
</div>

<div class="doors" id="doors"></div>

<div class="results" id="results"></div>

<script>
let running = false;
let stayWins = 0;
let switchWins = 0;
let trials = 0;

const doorsContainer = document.getElementById("doors");
const speedSlider = document.getElementById("speed");
const speedLabel = document.getElementById("speedLabel");

speedSlider.oninput = () => {
  speedLabel.innerText = speedSlider.value + " ms";
};

function createDoors() {
  doorsContainer.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.className = "door";
    d.innerText = "?";
    doorsContainer.appendChild(d);
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function runRound() {
  createDoors();
  const doors = document.querySelectorAll(".door");

  const prize = Math.floor(Math.random() * 3);
  const choice = Math.floor(Math.random() * 3);

  doors[choice].classList.add("selected");

  await sleep(speedSlider.value);

  // host reveals goat
  let reveal;
  do {
    reveal = Math.floor(Math.random() * 3);
  } while (reveal === prize || reveal === choice);

  doors[reveal].classList.add("revealed");
  doors[reveal].innerText = "🐐";

  await sleep(speedSlider.value);

  // switch choice
  let switchChoice;
  for (let i = 0; i < 3; i++) {
    if (i !== choice && i !== reveal) switchChoice = i;
  }

  // evaluate both strategies
  const stayWin = (choice === prize);
  const switchWin = (switchChoice === prize);

  if (stayWin) stayWins++;
  if (switchWin) switchWins++;

  trials++;

  // reveal result visually (show prize)
  doors[prize].classList.add("open");
  doors[prize].innerText = "💰";

  updateResults();
  await sleep(speedSlider.value);
}

function updateResults() {
  const stayRate = ((stayWins / trials) * 100).toFixed(2);
  const switchRate = ((switchWins / trials) * 100).toFixed(2);

  document.getElementById("results").innerHTML = `
    Trials: ${trials} <br>
    Stay Win Rate: ${stayRate}% <br>
    Switch Win Rate: ${switchRate}%
  `;
}

async function loop() {
  while (running) {
    await runRound();
  }
}

function start() {
  if (!running) {
    running = true;
    loop();
  }
}

function stop() {
  running = false;
}

// initialize
createDoors();
</script>

</body>
</html>
